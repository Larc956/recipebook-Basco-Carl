{% extends 'base.html' %}

{% block title %}{{ name }}{% endblock %}

{% block content %}
    <h2>{{ name }}</h2>
    
    <h3>Ingredients</h3>
    <ul>
        {% for ingredient in ingredients %}
            <li>
                {{ ingredient.name }} - {{ ingredient.quantity }}
            </li>
        {% endfor %}
    </ul>
    
    <a href="/recipes/list">Back to Recipes</a>
{% endblock %}
