{% extends 'base.html' %}

{% block title %}{{ recipe.name }}{% endblock %}

{% block content %}
    <h2>{{ recipe.name }}</h2>
    
    <h3>Ingredients</h3>
    <ul>
        {% for ingredient in recipe.ingredients.all %}
            <li>
                {{ ingredient.quantity }} - {{ ingredient.ingredient.name }}
            </li>
        {% endfor %}
    </ul>
    
    <br>
    <a href="/recipes/list">Back to Recipes</a>
{% endblock %}
