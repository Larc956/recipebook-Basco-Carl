{% extends 'base.html' %}

{% block page_title %}Recipe List{% endblock %}

{% block content %}
<ul>
    {% for recipe in recipes %}
    <li>
        <a href="{{ recipe.get_absolute_url }}">{{ recipe.name }}</a>
    </li>
    {% endfor %}
</ul>

{% if user.is_authenticated %}
<br>
<a href="{% url 'ledger:recipe_create' %}">Add a new recipe</a>
{% endif %}
{% endblock %}
