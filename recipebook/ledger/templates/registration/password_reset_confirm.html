{% extends 'base.html' %}
{% block page_title %}Enter New Password{% endblock %}
{% block content %}
    {% if validlink %}
        <form method="POST">
            {% csrf_token %} {{ form.as_p }}
            <button type="submit">Change password</button>
        </form>
    {% else %}
        <p>The password reset link was invalid, possibly because it has already been used.</p>
    {% endif %}
{% endblock %}
